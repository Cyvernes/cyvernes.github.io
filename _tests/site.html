<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Tests du site</title></head>
<body>
    <h1>Tests du site</h1>
    <pre id="results">En cours…</pre>
    <!-- Fixed in view: browsers pause the rendering of off-screen iframes. -->
    <iframe id="app" title="Page testée" style="position:fixed;top:0;right:0;width:1280px;height:850px;border:0"></iframe>
    <script>
    /* Open through a static HTTP server (python _tests/run_tablette.py --page _tests/site.html). _tests is excluded by Jekyll. */
    (async function () {
        'use strict';
        const results = document.getElementById('results');
        const messages = [];
        let passed = 0;
        let failed = 0;
        function assert(condition, message) { if (!condition) throw new Error(message); }
        async function test(name, callback) {
            try { await callback(); passed++; messages.push(`PASS ${name}`); }
            catch (error) { failed++; messages.push(`FAIL ${name}: ${error.message}`); }
            results.textContent = `${passed} passed, ${failed} failed\n${messages.join('\n')}`;
        }

        const frame = document.getElementById('app');
        let loads = 0;
        let doc = null;
        let win = null;
        const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
        // Headless browsers do not always paint the iframe: never wait for its rendering
        // (requestAnimationFrame, document.fonts.ready, events fired at paint time).
        // Poll from this page instead, forcing the iframe layout each time.
        async function waitFor(condition, timeout = 3000) {
            for (let elapsed = 0; elapsed < timeout; elapsed += 25) {
                doc.documentElement.getBoundingClientRect();
                if (condition()) return true;
                await wait(25);
            }
            return condition();
        }
        // Apply a new iframe size: force the layout rather than wait for a frame,
        // which headless browsers do not always paint.
        async function settle() {
            frame.getBoundingClientRect();
            doc.documentElement.getBoundingClientRect();
            win.dispatchEvent(new win.Event('resize'));
            await wait(60);
        }
        // Loads index.html with a query string and a saved language (null: none saved).
        async function load(query = '', language = null, width = 1280, height = 850) {
            if (language === null) localStorage.removeItem('language');
            else localStorage.setItem('language', language);
            frame.style.width = `${width}px`;
            frame.style.height = `${height}px`;
            frame.removeAttribute('srcdoc');
            const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
            loads++;
            frame.src = `../index.html${query}${query ? '&' : '?'}load=${loads}`;
            await loaded;
            doc = frame.contentDocument;
            win = frame.contentWindow;
            await settle();
        }
        const text = selector => doc.querySelector(selector)?.textContent.trim();
        const query = () => new URLSearchParams(win.location.search);
        const count = selector => doc.querySelectorAll(selector).length;
        const data = expression => win.eval(expression);
        const scrollTo = top => {
            win.scrollTo({ top, behavior: 'instant' });
            win.dispatchEvent(new win.Event('scroll'));
        };
        const activeLink = () => [...doc.querySelectorAll('.nav-link.active')].map(link => link.getAttribute('href')).join(',');
        const modalOf = id => doc.getElementById(doc.querySelector(`#${id} .citation-link`).dataset.modal);
        const loadImage = src => new Promise((resolve, reject) => {
            const image = new Image();
            image.onload = () => resolve(image);
            image.onerror = () => reject(new Error(`Image introuvable : ${src}`));
            image.src = src;
        });

        await test('Anglais par défaut : textes, listes, fenêtres et icônes', async () => {
            await load();
            assert(doc.documentElement.lang === 'en' && text('[data-lang="nav-home"]') === 'Home', 'La page n’est pas en anglais.');
            assert(doc.title === 'Clément Yvernes · Causal Inference', `Titre inattendu : ${doc.title}`);
            assert(!query().has('lang'), 'Paramètre de langue ajouté en anglais.');
            assert(count('#publications-container .publication-item') === data('publications.length'), 'Publications manquantes.');
            assert(count('#conferences-container .publication-item') === data('presentations.length'), 'Présentations manquantes.');
            assert(count('#teaching-container .publication-item') === data('courses.length'), 'Cours manquants.');
            assert(count('dialog.citation-modal') === data('publications.length'), 'Fenêtres de citation manquantes.');
            const links = [...doc.querySelectorAll('a.pub-link, button.pub-link')];
            assert(links.length > 20 && links.every(link => link.querySelector('svg.icon :is(path, polyline, rect, circle)')), 'Lien sans icône.');
            assert(doc.querySelector('.pres-award svg.icon') && doc.querySelector('#langBtn svg.icon path'), 'Icône du prix ou du bouton de langue absente.');
            assert(!doc.querySelector('[class*="fa-"], i.fas'), 'Reste d’icône Font Awesome.');
        });

        await test('Aucune requête vers un autre site ; police Inter locale chargée', async () => {
            await load();
            const inter = () => [...doc.fonts].filter(face => face.family.replace(/["']/g, '') === 'Inter');
            assert(await waitFor(() => inter().some(face => face.status === 'loaded')), 'Police Inter non chargée.');
            const resources = win.performance.getEntriesByType('resource').map(entry => entry.name);
            const outside = resources.filter(name => new URL(name).origin !== win.location.origin);
            assert(outside.length === 0, `Ressources externes : ${outside.join(', ')}`);
            assert(resources.some(name => name.endsWith('/fonts/inter-latin.woff2')), 'Police locale non téléchargée.');
            assert(win.getComputedStyle(doc.body).fontFamily.startsWith('Inter'), 'Inter n’est pas la police du texte.');
        });

        await test('Partage : images PNG aux bonnes dimensions, balises correctes', async () => {
            const meta = selector => doc.querySelector(selector)?.getAttribute('content');
            assert(meta('meta[property="og:image"]') === 'https://cyvernes.github.io/images/og-image.png', 'og:image incorrect.');
            assert(meta('meta[name="twitter:image"]') === 'https://cyvernes.github.io/images/og-image.png', 'twitter:image incorrect.');
            assert(meta('meta[name="twitter:card"]') === 'summary_large_image', 'twitter:card absent.');
            assert(meta('meta[property="og:image:width"]') === '2400' && meta('meta[property="og:image:height"]') === '1260', 'Dimensions non déclarées.');
            const share = await loadImage('../images/og-image.png');
            assert(share.naturalWidth === 2400 && share.naturalHeight === 1260, `Image de partage : ${share.naturalWidth}×${share.naturalHeight}`);
            const touchHref = doc.querySelector('link[rel="apple-touch-icon"]').getAttribute('href');
            assert(touchHref.endsWith('.png'), 'Icône iOS non PNG.');
            const touch = await loadImage(new URL(touchHref, win.location.href).href);
            assert(touch.naturalWidth === 180 && touch.naturalHeight === 180, `Icône iOS : ${touch.naturalWidth}×${touch.naturalHeight}`);
            const alternate = doc.querySelector('link[rel="alternate"][hreflang="fr"]');
            assert(alternate && alternate.getAttribute('href') === 'https://cyvernes.github.io/?lang=fr', 'Version française non déclarée.');
        });

        await test('Favicon, robots.txt et fichiers annexes', async () => {
            assert(!doc.querySelector('link[rel="manifest"]'), 'Manifest encore déclaré.');
            assert(!doc.querySelector('link[rel="icon"][type="image/x-icon"][href$=".svg"]'), 'Icône SVG déclarée comme .ico.');
            const icons = [...doc.querySelectorAll('link[rel="icon"]')].map(link => link.getAttribute('href'));
            assert(icons.includes('/favicon.ico') && icons.includes('/images/favicon.svg'), `Icônes déclarées : ${icons.join(', ')}`);
            const ico = await loadImage('../favicon.ico');
            assert(ico.naturalWidth >= 16, 'favicon.ico illisible.');
            for (const svg of ['../images/favicon.svg', '../images/profile.svg']) {
                const source = await fetch(svg).then(response => response.text());
                assert(source.includes('#1a365d') && !source.includes('#ed8936'), `${svg} : couleurs hors palette.`);
            }
            const robots = await fetch('../robots.txt').then(response => response.text());
            assert(robots.includes('Sitemap: https://cyvernes.github.io/sitemap.xml'), 'Sitemap non déclaré dans robots.txt.');
            assert((await fetch('../site.webmanifest')).status === 404, 'site.webmanifest toujours présent.');
        });

        await test('Médiation et cours : lien explicite vers la tablette, date, page du cours', async () => {
            for (const language of ['en', 'fr']) {
                await load('', language);
                const tablet = doc.querySelector('#fete-science-2025 a[href="tablette.html"]');
                assert(tablet && !/^(here|ici)$/i.test(tablet.textContent.trim()) && tablet.textContent.trim().length > 12, `${language} : lien vers la tablette peu explicite.`);
                assert(doc.querySelector('#fete-science-2025 time[datetime="2025-10"]')?.textContent === (language === 'fr' ? 'Octobre 2025' : 'October 2025'), `${language} : date de l’atelier absente.`);
                const withSite = data('courses.filter(course => course.website)');
                assert(withSite.length > 0, 'Aucun cours avec page officielle (test à adapter).');
                for (const course of withSite) {
                    const link = doc.querySelector(`#${course.id} a.pub-link[href="${course.website}"]`);
                    assert(link && link.querySelector('svg.icon') && link.textContent.trim() === (language === 'fr' ? 'Page du cours' : 'Course page'), `${language} : page du cours ${course.id} non affichée.`);
                }
            }
        });

        await test('Bouton de langue : français, adresse ?lang=fr, puis retour en anglais', async () => {
            await load();
            doc.getElementById('langBtn').click();
            assert(doc.documentElement.lang === 'fr' && text('[data-lang="nav-home"]') === 'Accueil', 'Passage en français raté.');
            assert(query().get('lang') === 'fr', 'Adresse sans ?lang=fr.');
            assert(localStorage.getItem('language') === 'fr', 'Choix non mémorisé.');
            assert(doc.title === 'Clément Yvernes · Inférence causale', `Titre non traduit : ${doc.title}`);
            assert(doc.querySelector('meta[name="description"]').content.startsWith('Clément Yvernes étudie'), 'Description non traduite.');
            assert(doc.querySelector('link[rel="canonical"]').href === 'https://cyvernes.github.io/?lang=fr', 'Adresse de référence non mise à jour.');
            assert(count('#publications-container .publication-item') === data('publications.length'), 'Publications perdues.');
            assert(text('.copy-btn') === 'Copier BibTeX' && doc.querySelector('.modal-close').getAttribute('aria-label') === 'Fermer', 'Fenêtres non traduites.');
            assert(doc.querySelectorAll('a.pub-link svg.icon').length > 20, 'Icônes perdues au changement de langue.');
            doc.getElementById('langBtn').click();
            assert(doc.documentElement.lang === 'en' && text('[data-lang="nav-home"]') === 'Home', 'Retour en anglais raté.');
            assert(!query().has('lang') && query().get('load') !== null, 'Adresse mal nettoyée en anglais.');
            assert(doc.querySelector('link[rel="canonical"]').href === 'https://cyvernes.github.io/', 'Adresse de référence non rétablie.');
        });

        await test('Liens ?lang= : priorité sur la langue mémorisée', async () => {
            await load('?lang=fr', 'en');
            assert(doc.documentElement.lang === 'fr' && text('[data-lang="nav-home"]') === 'Accueil', '?lang=fr ignoré.');
            await load('?lang=en', 'fr');
            assert(doc.documentElement.lang === 'en' && !query().has('lang'), '?lang=en ignoré ou laissé dans l’adresse.');
            await load('', 'fr');
            assert(doc.documentElement.lang === 'fr' && query().get('lang') === 'fr', 'Langue mémorisée non reportée dans l’adresse.');
            await load('?lang=xx', null);
            assert(doc.documentElement.lang === 'en', 'Valeur inconnue mal gérée.');
        });

        await test('Anti-flash : jamais masquée en anglais, visible après traduction en français', async () => {
            await load('', 'en');
            assert(!doc.getElementById('anti-flash-style') && win.revealAfterInitialization === undefined, 'Page masquée en anglais.');
            assert(win.getComputedStyle(doc.documentElement).opacity === '1', 'Page invisible en anglais.');
            await load('', 'fr');
            assert(typeof win.revealAfterInitialization === 'function', 'Masquage non préparé en français.');
            assert(!doc.getElementById('anti-flash-style') && win.getComputedStyle(doc.documentElement).opacity === '1', 'Page restée masquée en français.');
        });

        await test('Menu : la section lue est soulignée, la dernière tout en bas', async () => {
            for (const [width, height, language] of [[1280, 850, 'en'], [1024, 850, 'fr'], [1440, 1000, 'en'], [390, 800, 'fr']]) {
                await load('', language, width, height);
                scrollTo(0);
                assert(activeLink() === '#home', `${width}px : accueil non souligné (${activeLink()}).`);
                scrollTo(doc.getElementById('conferences').offsetTop);
                assert(activeLink() === '#conferences', `${width}px : section du milieu (${activeLink()}).`);
                scrollTo(doc.documentElement.scrollHeight);
                assert(activeLink() === '#about', `${width}px ${language} : « À propos » non souligné en bas (${activeLink()}).`);
            }
        });

        await test('Menu : chaque entrée reprend le titre de sa section', async () => {
            for (const language of ['en', 'fr']) {
                await load('', language);
                for (const link of doc.querySelectorAll('.nav-link:not([href="#home"])')) {
                    const title = doc.querySelector(`${link.getAttribute('href')} .section-title`);
                    assert(title, `Section sans titre : ${link.getAttribute('href')}`);
                    const label = link.textContent.trim().toLowerCase();
                    assert(title.textContent.toLowerCase().includes(label), `${language} : menu « ${link.textContent.trim()} » ≠ titre « ${title.textContent.trim()} ».`);
                }
            }
        });

        await test('Menu sur ordinateur : tient sur une ligne, sans chevauchement, dès 1021 px', async () => {
            for (const language of ['en', 'fr']) {
                await load('', language, 1021, 800);
                for (const width of [1021, 1100, 1280, 1440]) {
                    frame.style.width = `${width}px`;
                    await settle();
                    const logo = doc.querySelector('.nav-logo').getBoundingClientRect();
                    const menu = doc.querySelector('.nav-menu').getBoundingClientRect();
                    const right = doc.querySelector('.nav-right').getBoundingClientRect();
                    const links = [...doc.querySelectorAll('.nav-link')].map(link => link.getBoundingClientRect());
                    assert(getComputedStyle(doc.querySelector('.hamburger')).display === 'none', `${width}px : menu hamburger affiché.`);
                    assert(logo.right <= menu.left && menu.right <= right.left, `${language} ${width}px : le menu chevauche le logo ou le bouton de langue.`);
                    assert(links.every(rect => rect.top === links[0].top && rect.right <= right.left), `${language} ${width}px : le menu passe à la ligne.`);
                }
            }
        });

        await test('Publications : auteurs juste sous le titre, PDF et Citation à droite, le reste dans « ··· »', async () => {
            for (const language of ['en', 'fr']) {
                await load('', language, 860, 800);
                for (const item of doc.querySelectorAll('#publications-container .publication-item')) {
                    const visible = [...item.querySelectorAll('.pub-links > a.pub-link, .pub-links > button.pub-link')].map(link => link.textContent.trim());
                    assert(visible.join('|') === 'PDF|Citation', `${item.id} : boutons visibles ${visible.join(', ')}.`);
                    const hidden = [...item.querySelectorAll('.pub-more-menu a')].map(link => link.getAttribute('href'));
                    const pub = data(`publications.find(p => p.id === '${item.id}')`);
                    const expected = Object.entries(pub.links).filter(([name, url]) => url && name !== 'pdf').map(([, url]) => url);
                    assert(expected.every(url => hidden.includes(url)) && hidden.length === expected.length, `${item.id} : liens du menu « ··· » incomplets.`);
                }
                for (const width of [860, 940, 1020, 1100, 1280, 1440]) {
                    frame.style.width = `${width}px`;
                    await settle();
                    for (const item of doc.querySelectorAll('#publications-container .publication-item')) {
                        const box = selector => item.querySelector(selector).getBoundingClientRect();
                        const [title, authors, venue, links] = ['.pub-title', '.pub-authors', '.pub-venue', '.pub-links'].map(box);
                        const where = `${language} ${width}px ${item.id}`;
                        assert(authors.top >= title.bottom - 1 && authors.top - title.bottom <= 8, `${where} : les auteurs ne sont pas juste sous le titre.`);
                        assert(Math.abs((links.top + links.bottom) / 2 - (authors.top + authors.bottom) / 2) <= 8, `${where} : boutons décalés de la ligne des auteurs.`);
                        const sameLine = Math.abs(venue.top - authors.top) <= 2 && venue.left >= authors.right;
                        assert(sameLine || venue.top >= authors.bottom - 1, `${where} : « année · lieu » ni à la suite ni sous les auteurs.`);
                        assert(authors.right <= links.left && venue.right <= links.left, `${where} : le texte chevauche les boutons.`);
                    }
                }
            }
        });

        await test('Menu mobile : se ferme avec Échap, un clic à côté ou un lien', async () => {
            await load('', 'en', 390, 800);
            const hamburger = doc.querySelector('.hamburger');
            const menu = doc.querySelector('.nav-menu');
            const isOpen = () => menu.classList.contains('active') && hamburger.getAttribute('aria-expanded') === 'true';
            const isClosed = () => !menu.classList.contains('active') && hamburger.getAttribute('aria-expanded') === 'false';
            hamburger.click();
            assert(isOpen(), 'Le menu ne s’ouvre pas.');
            doc.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
            assert(isClosed() && doc.activeElement === hamburger, 'Échap ne ferme pas le menu ou ne rend pas le focus.');
            hamburger.click();
            menu.click();
            assert(isOpen(), 'Un clic dans le menu le ferme.');
            doc.querySelector('.hero-title').click();
            assert(isClosed(), 'Un clic à côté ne ferme pas le menu.');
            hamburger.click();
            doc.querySelector('.nav-link[href="#teaching"]').click();
            assert(isClosed(), 'Un lien ne ferme pas le menu.');
        });

        await test('Fenêtres de citation : dialogue modal, focus, fermeture', async () => {
            await load();
            const button = doc.querySelector('#yvernes2025relaxing .citation-link');
            const modal = modalOf('yvernes2025relaxing');
            assert(modal.tagName === 'DIALOG' && button.getAttribute('aria-haspopup') === 'dialog', 'Pas un élément <dialog>.');
            const title = doc.getElementById(modal.getAttribute('aria-labelledby'));
            assert(title && title.textContent === 'Citation', 'Titre de la fenêtre non relié.');
            assert(modal.querySelector('.modal-subtitle').textContent.startsWith('Relaxing partition admissibility'), 'Titre de l’article absent.');
            assert(modal.querySelector('label[for^="bibtex-"]') && modal.querySelector('label[for^="apa-"]'), 'Zones de texte sans étiquette.');

            button.focus();
            button.click();
            assert(modal.open && modal.matches(':modal'), 'La fenêtre ne s’ouvre pas en mode modal.');
            assert(modal.contains(doc.activeElement), 'Le focus n’entre pas dans la fenêtre.');
            assert(win.getComputedStyle(doc.body).overflow === 'hidden', 'La page défile derrière la fenêtre.');

            const box = modal.getBoundingClientRect();
            const outside = { clientX: box.left - 20, clientY: box.top + 20, bubbles: true };
            const textarea = modal.querySelector('textarea');
            textarea.click();
            assert(modal.open, 'Un clic dans la fenêtre la ferme.');
            // Sélection commencée dans la fenêtre et relâchée sur le fond : la fenêtre reste ouverte.
            textarea.dispatchEvent(new win.PointerEvent('pointerdown', { clientX: box.left + 40, clientY: box.top + 120, bubbles: true }));
            modal.dispatchEvent(new win.MouseEvent('click', outside));
            assert(modal.open, 'Une sélection relâchée sur le fond ferme la fenêtre.');

            modal.querySelector('.modal-close').click();
            assert(!modal.open, 'La croix ne ferme pas la fenêtre.');
            assert(await waitFor(() => doc.activeElement === button), 'Le focus ne revient pas sur le bouton « Citation ».');
            assert(win.getComputedStyle(doc.body).overflow !== 'hidden', 'Défilement non rétabli.');

            button.click();
            assert(modal.open, 'La fenêtre ne se rouvre pas.');
            modal.dispatchEvent(new win.PointerEvent('pointerdown', outside));
            modal.dispatchEvent(new win.MouseEvent('click', outside));
            assert(!modal.open, 'Un clic sur le fond ne ferme pas la fenêtre.');
            assert(await waitFor(() => doc.activeElement === button), 'Le focus ne revient pas après un clic sur le fond.');
            // La touche Échap est gérée par le navigateur lui-même (élément <dialog>).
        });

        await test('Citations : copie, clé PMLR et format APA', async () => {
            await load();
            let copied = null;
            Object.defineProperty(win.navigator, 'clipboard', { configurable: true,
                value: { writeText: value => { copied = value; return Promise.resolve(); } } });
            const uai = modalOf('yvernes2025complete');
            doc.querySelector('#yvernes2025complete .citation-link').click();
            const bibtex = uai.querySelector('textarea[id^="bibtex-"]').value;
            assert(bibtex.startsWith('@inproceedings{pmlr-v286-yvernes25a,'), `Clé BibTeX : ${bibtex.split('\n')[0]}`);
            uai.querySelector('.copy-btn').click();
            assert(await waitFor(() => uai.querySelector('.copy-btn').textContent === '✓ Copied!', 1000) && copied === bibtex, 'Copie du BibTeX ratée.');
            uai.querySelector('.modal-close').click();

            const apa = id => modalOf(id).querySelector('textarea[id^="apa-"]').value;
            assert(apa('yvernes2025relaxing') === 'Yvernes, C., Devijver, E., Ribeiro, A. H., Clausel, M., & Gaussier, E. (2025). Relaxing partition admissibility in Cluster-DAGs: a causal calculus with arbitrary variable clustering. In Advances in Neural Information Processing Systems (Vol. 38, pp. 72492–72525). Curran Associates, Inc. https://proceedings.neurips.cc/paper_files/paper/2025/hash/69078488008b859a347ed36bc6531453-Abstract-Conference.html',
                `APA NeurIPS : ${apa('yvernes2025relaxing')}`);
            assert(apa('yvernes2025complete').endsWith('Series. In Proceedings of the Forty-first Conference on Uncertainty in Artificial Intelligence (Vol. 286, pp. 4844–4871). PMLR. https://proceedings.mlr.press/v286/yvernes25a.html'),
                `APA UAI : ${apa('yvernes2025complete')}`);
            assert(apa('yvernes2026unveiling').includes('Clausel, M., & Gaussier, E. (2026).') && apa('yvernes2026unveiling').includes('In Proceedings of the 43rd International Conference on Machine Learning (Vol. 306, pp. 152645–152672). PMLR.'), `APA ICML : ${apa('yvernes2026unveiling')}`);
            // Article publié : le PDF est la version finale des actes, pas la prépublication arXiv
            for (const id of ['yvernes2025complete', 'yvernes2026unveiling']) {
                const pdf = [...doc.querySelectorAll(`#${id} a.pub-link`)].find(link => link.textContent.trim() === 'PDF');
                assert(pdf && pdf.href.startsWith('https://raw.githubusercontent.com/mlresearch/'), `${id} : PDF hors actes (${pdf?.href}).`);
            }
            assert(apa('yvernes2026identifiability').endsWith('[Preprint]. arXiv. https://arxiv.org/abs/2610.13520'), 'APA de la prépublication incorrect.');
            assert(apa('yvernes2025identifiability').endsWith('In CAR Workshop at the 41st Conference on Uncertainty in Artificial Intelligence (UAI). https://arxiv.org/abs/2507.06213'), 'APA de l’atelier incorrect.');
            assert([...doc.querySelectorAll('.citation-modal textarea')].every(area => !area.value.includes('&amp;')), 'Texte de citation mal échappé.');
        });

        await test('Aucun débordement horizontal de 320 à 1440 px, en français et en anglais', async () => {
            for (const language of ['en', 'fr']) {
                await load('', language, 320, 800);
                for (const width of [320, 360, 390, 768, 1024, 1280, 1440]) {
                    frame.style.width = `${width}px`;
                    await settle();
                    const root = doc.documentElement;
                    assert(root.scrollWidth <= root.clientWidth, `${language} ${width}px : ${root.scrollWidth} > ${root.clientWidth}`);
                }
            }
        });

        await test('Vieux navigateur (sans Object.hasOwn ni dialogue modal) : la page reste utilisable', async () => {
            const source = await fetch('../index.html').then(response => response.text());
            const base = new URL('../', location.href).href;
            const old = '<script>delete Object.hasOwn; delete HTMLDialogElement.prototype.showModal; delete HTMLDialogElement.prototype.close;<\/script>';
            localStorage.setItem('language', 'en');
            const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
            frame.srcdoc = source.replace('<head>', `<head><base href="${base}">${old}`);
            await loaded;
            doc = frame.contentDocument;
            win = frame.contentWindow;
            assert(typeof win.Object.hasOwn === 'undefined', 'Simulation inopérante.');
            assert(count('#publications-container .publication-item') === data('publications.length'), 'Publications absentes.');
            doc.getElementById('langBtn').click();
            assert(text('[data-lang="nav-home"]') === 'Accueil', 'Bouton de langue inopérant.');
            const modal = modalOf('yvernes2025relaxing');
            doc.querySelector('#yvernes2025relaxing .citation-link').click();
            assert(modal.hasAttribute('open'), 'Fenêtre de citation non affichée.');
            modal.querySelector('.modal-close').click();
            assert(!modal.hasAttribute('open'), 'Fenêtre de citation non refermée.');
            frame.removeAttribute('srcdoc');
        });

        document.body.dataset.testStatus = failed ? 'failed' : 'passed';
        results.textContent = `${passed} passed, ${failed} failed\n${messages.join('\n')}`;
    })().catch(error => {
        document.body.dataset.testStatus = 'failed';
        document.getElementById('results').textContent += `\nFATAL ${error.stack}`;
    });
    </script>
</body>
</html>
