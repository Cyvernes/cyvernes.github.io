<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Tests de la tablette causale</title><script src="../tablette-model.js"></script></head>
<body>
    <h1>Tests de la tablette causale</h1>
    <pre id="results">En cours…</pre>
    <iframe id="app" src="../tablette.html?lang=fr" title="Page testée" style="width:1100px;height:1400px;border:0"></iframe>
    <script>
    /* Open through a static HTTP server. _tests is excluded by Jekyll. */
    (async function () {
        'use strict';
        const results = document.getElementById('results');
        const messages = [];
        let passed = 0;
        let failed = 0;
        function assert(condition, message) { if (!condition) throw new Error(message); }
        async function test(name, callback) {
            try { await callback(); passed++; messages.push(`PASS ${name}`); }
            catch (error) { failed++; messages.push(`FAIL ${name}: ${error.message}`); }
            results.textContent = `${passed} passed, ${failed} failed\n${messages.join('\n')}`;
        }
        const model = window.CausalTablet;
        const uiOnly = new URLSearchParams(location.search).has('ui-only');
        if (uiOnly) messages.push('SKIP Comparaisons Arduino (mode ui-only).');
        const source = uiOnly ? null : await fetch('../code_arduino.ino').then(response => {
            assert(response.ok, 'Le code Arduino doit être disponible pour la comparaison.');
            return response.text();
        });
        function readArray(name) {
            const match = source.match(new RegExp(name + '\\s*\\[[^\\]]*\\]\\s*=\\s*\\{([\\s\\S]*?)\\}'));
            assert(match, `Tableau Arduino absent : ${name}`);
            return match[1].replace(/\/\/[^\r\n]*/g, '').split(',').map(value => value.trim()).filter(Boolean).map(Number);
        }
        const data = source ? readArray('graphData') : null;
        const index = source ? readArray('graphIndex') : model.parents.map((_, id) => id);
        const parents = source ? index.map(start => data.slice(start + 1, start + 1 + data[start])) : model.parents;
        const order = [];
        const remaining = new Set(index.map((_, id) => id));
        while (remaining.size) {
            const ready = [...remaining].filter(id => parents[id].every(parent => !remaining.has(parent)));
            assert(ready.length, 'Cycle dans le code Arduino.');
            ready.forEach(id => { order.push(id); remaining.delete(id); });
        }
        if (source) await test('Les données reproduisent exactement les tableaux Arduino', () => {
            assert(JSON.stringify(parents) === JSON.stringify(model.parents), 'Parents différents.');
            assert(/buttonDefaultStates[^=]*=\s*\{\s*(?:false[\s,]*){15}\}/.test(source), 'Valeurs initiales à mettre à jour.');
        });
        await test('Les quatre exercices sont les composantes indépendantes du graphe', () => {
            const seen = model.exercises.slice(0, 4).flatMap(exercise => exercise.nodes);
            assert(seen.length === 15 && new Set(seen).size === 15, 'Chaque bouton doit appartenir à un seul exercice.');
            model.exercises.slice(0, 4).forEach(exercise => exercise.nodes.forEach(id => {
                assert(parents[id].every(parent => exercise.nodes.includes(parent)), 'Parent extérieur à l’exercice.');
            }));
        });
        if (source) await test('2250 configurations : mêmes états que la boucle Arduino', () => {
            let configurations = 0;
            for (const exercise of model.exercises.slice(0, 4)) {
                for (let combination = 0; combination < 3 ** exercise.nodes.length; combination++) {
                    const states = model.createNodeStates(exercise);
                    const physical = Array.from({ length: 15 }, () => ({ isOn: false, isInterv: false }));
                    let encoded = combination;
                    exercise.nodes.forEach(id => {
                        const state = encoded % 3;
                        encoded = Math.floor(encoded / 3);
                        states[id] = { isInterv: state !== 0, isOn: state === 2 };
                        physical[id] = { ...states[id] };
                    });
                    for (const id of order) {
                        if (!physical[id].isInterv) physical[id].isOn = parents[id].some(parent => physical[parent].isOn);
                    }
                    const calculated = model.evaluate(exercise, states);
                    exercise.nodes.forEach(id => assert(JSON.stringify(calculated[id]) === JSON.stringify(physical[id]), `Exercice ${exercise.id}, configuration ${combination}, bouton ${id}.`));
                    configurations++;
                }
            }
            assert(configurations === 2250, `Nombre inattendu : ${configurations}`);
        });
        await test('Une intervention conserve la valeur présente, puis coupe ses causes', () => {
            const exercise = model.exercises[2];
            let states = model.createNodeStates(exercise);
            states = model.toggleIntervention(exercise, states, 1);
            states = model.toggleValue(exercise, states, 1);
            assert(states[3].isOn && states[2].isOn, 'La chaîne doit s’allumer.');
            states = model.toggleIntervention(exercise, states, 3);
            assert(states[3].isOn, 'Entrer en intervention doit conserver la valeur.');
            states = model.toggleValue(exercise, states, 3);
            assert(!states[3].isOn && !states[2].isOn && states[1].isOn, 'Forcer le milieu à zéro doit couper la propagation.');
            states = model.toggleIntervention(exercise, states, 3);
            assert(states[3].isOn && states[2].isOn, 'Le retour au naturel doit rétablir la propagation.');
        });
        await test('Un clic simple ne change pas un bouton naturel', () => {
            const exercise = model.exercises[0];
            const states = model.createNodeStates(exercise);
            assert(model.toggleValue(exercise, states, 7) === states, 'Le clic naturel doit rester sans effet.');
        });
        await test('La correction exige exactement les arêtes directes orientées', () => {
            for (const exercise of model.exercises) {
                const correct = exercise.nodes.flatMap(to => exercise.parents[to].map(from => ({ from, to })));
                assert(model.checkEdges(exercise, correct).correct, 'Bonne solution refusée.');
                assert(model.checkEdges(exercise, correct.slice(1)).missing === 1, 'Arête manquante non détectée.');
                const reversed = correct.map(({ from, to }) => ({ from: to, to: from }));
                assert(!model.checkEdges(exercise, reversed).correct, 'Orientation inverse acceptée.');
                assert(model.checkEdges(exercise, [...correct, { from: correct[0].to, to: correct[0].from }]).extra === 1, 'Arête de trop non détectée.');
            }
        });

        await test('Graphes aléatoires : taille, connexité, absence de cycles et reproductibilité', () => {
            const variants = new Set();
            for (let seed = 0; seed < 100; seed++) {
                for (const [exercise, size, count] of [
                    [model.createRandomExercise(seed), 7, 7],
                    [model.createRandomExercise(seed, 9), 9, 10],
                    [model.createRandomExercise(seed, 12), 12, 14],
                    [model.createDailyExercise(new Date(Date.UTC(2026, 0, seed + 1))), 9, 11]
                ]) {
                    assert(exercise.nodes.length === size && exercise.parents.flat().length === count, 'Complexité incorrecte.');
                    const remaining = new Set(exercise.nodes);
                    while (remaining.size) {
                        const ready = [...remaining].filter(id => exercise.parents[id].every(parent => !remaining.has(parent)));
                        assert(ready.length, 'Cycle détecté.');
                        ready.forEach(id => remaining.delete(id));
                    }
                    const visited = new Set([exercise.nodes[0]]);
                    for (let i = 0; i < size; i++) exercise.nodes.forEach(to => exercise.parents[to].forEach(from => {
                        if (visited.has(from) || visited.has(to)) { visited.add(from); visited.add(to); }
                    }));
                    assert(visited.size === size, 'Bouton isolé du réseau.');
                    if (seed < 8) for (const from of exercise.nodes) for (const to of exercise.nodes) {
                        if (from === to) continue;
                        const states = model.createNodeStates(exercise);
                        exercise.nodes.forEach(id => { states[id].isInterv = id !== to; });
                        states[from].isOn = true;
                        assert(model.evaluate(exercise, states)[to].isOn === exercise.parents[to].includes(from), 'Influence directe incorrecte.');
                    }
                }
                const exercise = model.createRandomExercise(seed);
                assert(JSON.stringify(exercise.parents) === JSON.stringify(model.createRandomExercise(seed).parents), 'Seed non reproductible.');
                variants.add(JSON.stringify(exercise.parents));
            }
            assert(variants.size > 90, 'Pas assez de diversité.');
        });
        await test('Défi quotidien : même date, même graphe ; changement à minuit à Paris', () => {
            const first = model.createDailyExercise(new Date('2026-10-19T00:00:00Z'));
            const last = model.createDailyExercise(new Date('2026-10-19T21:59:59Z'));
            const next = model.createDailyExercise(new Date('2026-10-19T22:00:00Z'));
            assert(first.seed === 20261019 && JSON.stringify(first.parents) === JSON.stringify(last.parents), 'Défi instable au cours de la journée.');
            assert(next.seed === 20261020 && JSON.stringify(next.parents) !== JSON.stringify(first.parents), 'Défi non renouvelé à minuit.');
            assert(model.daySeed(new Date('2026-10-25T22:59:59Z')) === 20261025 && model.daySeed(new Date('2026-10-25T23:00:00Z')) === 20261026, 'Heure d’hiver incorrecte.');
        });

        const frame = document.getElementById('app');
        if (!frame.contentDocument.querySelector('.node-light')) await new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
        const doc = frame.contentDocument;
        const win = frame.contentWindow;
        const click = selector => { const element = doc.querySelector(selector); assert(element, `Élément absent : ${selector}`); element.dispatchEvent(new win.MouseEvent('click', { bubbles: true })); };
        const light = id => doc.querySelector(`.node-light[data-node="${id}"]`);
        const isOn = id => light(id).classList.contains('is-on');
        const isInterv = id => light(id).classList.contains('is-intervention');
        const draw = (from, to) => {
            const start = light(from).getBoundingClientRect();
            const end = light(to).getBoundingClientRect();
            const pointer = (type, rect) => new win.PointerEvent(type, {
                clientX: rect.left + rect.width / 2, clientY: rect.top + rect.height / 2,
                bubbles: true, pointerId: 1, button: 0, isPrimary: true
            });
            light(from).dispatchEvent(pointer('pointerdown', start));
            doc.dispatchEvent(pointer('pointermove', end));
            doc.dispatchEvent(pointer('pointerup', end));
        };
        const tap = id => light(id).dispatchEvent(new win.MouseEvent('click', { detail: 1, bubbles: true }));
        const doubleTap = id => { tap(id); tap(id); };
        const waitTap = () => new Promise(resolve => win.setTimeout(resolve, 370));
        const settleLayout = () => new Promise(resolve => {
            // Flush the iframe viewport before simulating resize: headless virtual
            // time can deliver timers before the native iframe resize event.
            frame.getBoundingClientRect();
            win.dispatchEvent(new win.Event('resize'));
            win.setTimeout(resolve, 60);
        });

        await test('Interface : six onglets et aucune flèche révélée au démarrage', () => {
            assert(doc.querySelectorAll('[role="tab"]').length === 6, 'Onglets absents.');
            assert(doc.querySelectorAll('.node-light').length === 2, 'Mauvais premier exercice.');
            assert(doc.querySelectorAll('.edge').length === 0, 'Une arête est révélée.');
            assert(doc.querySelector('#first-steps').dataset.step === 'help', 'Invitation à ouvrir l’aide absente.');
            click('#open-help');
            assert(!doc.querySelector('#help-panel').hidden, 'Aide inaccessible au démarrage.');
            assert(doc.querySelector('#first-steps').dataset.step === 'intervention', 'Premier geste non expliqué après ouverture de l’aide.');
            click('#close-help');
            assert(doc.querySelector('#first-steps').dataset.step === 'intervention', 'Invitation à ouvrir l’aide répétée.');
            assert(!doc.querySelector('#board-stats') && !doc.querySelector('#button-count'), 'Compteurs encore présents.');
        });
        await test('Interface : intervenir, allumer et bloquer un effet', () => {
            doubleTap(8);
            assert(isInterv(8) && !isOn(8), 'Intervention initiale incorrecte.');
            assert(doc.querySelector('#first-steps').dataset.step === 'value', 'Appui simple non expliqué.');
            light(8).click();
            assert(isOn(8) && isOn(7) && !isInterv(7), 'Propagation absente.');
            assert(doc.querySelector('#first-steps').dataset.step === 'arrow', 'Tracé non expliqué.');
            doubleTap(7);
            assert(isOn(7) && isInterv(7), 'La valeur doit rester allumée.');
            light(7).click();
            assert(isOn(8) && !isOn(7), 'Intervention éteinte non respectée.');
        });
        await test('Interface : double-clic fidèle au changement de mode Arduino', () => {
            doubleTap(7);
            assert(!isInterv(7) && isOn(7), 'Retour au naturel incorrect.');
            doubleTap(7);
            assert(isInterv(7) && isOn(7), 'Entrée en intervention incorrecte.');
        });
        await test('Interface : appui simple et double appui tactile sans changement parasite', async () => {
            const before = isOn(7);
            tap(7);
            await waitTap();
            assert(isOn(7) !== before, 'Appui simple sans effet.');
            doubleTap(7);
            await waitTap();
            assert(!isInterv(7) && isOn(7), 'Retour au naturel avec appui parasite.');
            doubleTap(7);
            await waitTap();
            assert(isInterv(7) && isOn(7), 'Entrée en intervention avec appui parasite.');
            assert(!doc.querySelector('#mode-draw'), 'Sélecteur de mode encore présent.');
        });
        await test('Interface : dessin par glisser-déposer et hypothèse sans effet sur les lumières', () => {
            const before = light(7).className;
            draw(7, 8);
            assert(doc.querySelectorAll('.edge').length === 1, 'Flèche absente.');
            assert(doc.querySelector('#first-steps').hidden, 'Guide encore présent après découverte des gestes.');
            assert(light(7).className === before, 'Une hypothèse change les lumières.');
            click('#check-edges');
            assert(!doc.querySelector('#feedback').hidden && !doc.querySelector('#feedback').classList.contains('is-correct'), 'Mauvais graphe accepté.');
            assert(!doc.querySelector('#result-panel').hidden, 'Résultat intégré non affiché.');
            click('#close-result');
        });
        await test('Interface : doublons évités, arêtes réciproques distinctes et suppression', () => {
            draw(7, 8);
            assert(doc.querySelectorAll('.edge').length === 1, 'Doublon créé.');
            draw(8, 7);
            const paths = [...doc.querySelectorAll('.edge-line')].map(path => path.getAttribute('d'));
            assert(paths.length === 2 && paths.every(path => path.includes('Q')), 'Les arêtes réciproques doivent être courbes.');
            click('.edge[aria-label="Supprimer la flèche 7 vers 8"]');
            assert(doc.querySelectorAll('.edge').length === 1, 'Suppression échouée.');
            click('#check-edges');
            assert(doc.querySelector('#feedback').classList.contains('is-correct'), 'Bonne solution non reconnue.');
        });
        await test('Interface : niveau suivant et retour aux essais précédents', () => {
            assert(doc.querySelector('#next-level'), 'Passage au niveau suivant absent.');
            click('#next-level');
            assert(doc.querySelector('#tab-trio-1').getAttribute('aria-selected') === 'true', 'Mauvais niveau sélectionné.');
            click('#tab-duo');
            assert(doc.querySelectorAll('.edge').length === 1 && isInterv(7), 'Essais oubliés au changement de niveau.');
        });
        await test('Interface : reset des boutons conservant les flèches', () => {
            click('#reset-buttons');
            assert(!isOn(7) && !isOn(8) && !isInterv(7) && !isInterv(8), 'Reset incomplet.');
            assert(doc.querySelectorAll('.edge').length === 1, 'Le reset efface l’hypothèse.');
        });
        await test('Interface : seul le verrou indique une intervention, sans commandes sous les lumières', async () => {
            await new Promise(resolve => win.setTimeout(resolve, 410));
            assert(!doc.querySelector('.node-mode, .node-state'), 'Commande ou libellé encore présent.');
            const lock = light(7).querySelector('.intervention-symbol');
            assert(win.getComputedStyle(lock).display === 'none', 'Verrou présent au naturel.');
            doubleTap(7);
            assert(isInterv(7) && win.getComputedStyle(lock).display !== 'none', 'Verrou absent en intervention.');
            light(7).click();
            assert(isOn(7) && win.getComputedStyle(lock).display !== 'none', 'Verrou perdu à l’allumage.');
            doubleTap(7);
            assert(!isInterv(7) && win.getComputedStyle(lock).display === 'none', 'Verrou conservé au retour naturel.');
        });
        await test('Interface : aide visible quand on appuie sur un bouton naturel', () => {
            light(7).click();
            assert(!doc.querySelector('#first-steps').hidden && doc.querySelector('#first-steps').textContent.includes('naturel'), 'Appui naturel sans explication visible.');
            doubleTap(7);
            assert(doc.querySelector('#first-steps').hidden, 'Rappel conservé après intervention.');
            click('#reset-buttons');
        });
        await test('Interface : exercices indépendants et essais conservés entre onglets', () => {
            click('#tab-trio-1');
            assert(doc.querySelectorAll('.node-light').length === 3 && doc.querySelectorAll('.edge').length === 0, 'Exercice non indépendant.');
            doubleTap(10); light(10).click();
            assert(isOn(9) && isOn(10) && !isOn(11), 'OU du collider incorrect.');
            click('#tab-duo');
            assert(doc.querySelectorAll('.edge').length === 1, 'Flèche du duo oubliée.');
            click('#tab-trio-1');
            assert(isOn(10) && isInterv(10), 'État du trio oublié.');
        });
        await test('Interface : raccourcis clavier retirés', () => {
            doc.querySelector('#tab-trio-1').dispatchEvent(new win.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
            assert(doc.querySelector('#tab-trio-1').getAttribute('aria-selected') === 'true', 'Raccourci d’onglet encore actif.');
            click('#tab-trio-2');
            light(1).dispatchEvent(new win.KeyboardEvent('keydown', { key: ' ', shiftKey: true, bubbles: true }));
            light(1).dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Enter', shiftKey: true, bubbles: true }));
            assert(!isInterv(1) && !doc.querySelector('.is-source'), 'Raccourci de bouton encore actif.');
        });
        await test('Interface : véritable chemin du glisser-déposer et aperçu de flèche', () => {
            const from = light(1).getBoundingClientRect();
            const to = light(2).getBoundingClientRect();
            const start = { clientX: from.left + from.width / 2, clientY: from.top + from.height / 2 };
            const end = { clientX: to.left + to.width / 2, clientY: to.top + to.height / 2 };
            light(1).dispatchEvent(new win.PointerEvent('pointerdown', { ...start, bubbles: true, pointerId: 1, button: 0, isPrimary: true }));
            doc.dispatchEvent(new win.PointerEvent('pointermove', { ...end, bubbles: true, pointerId: 1 }));
            assert(!doc.querySelector('#draft-edge').hasAttribute('hidden'), 'Aperçu invisible.');
            doc.dispatchEvent(new win.PointerEvent('pointerup', { ...end, bubbles: true, pointerId: 1 }));
            assert(doc.querySelectorAll('.edge').length === 1, 'Flèche non créée par glisser-déposer.');
            assert(doc.querySelector('#draft-edge').hasAttribute('hidden'), 'Aperçu non retiré.');
        });
        await test('Interface : correction et remise à zéro de chaque exercice', async () => {
            for (const exercise of win.CausalTablet.exercises) {
                click(`#tab-${exercise.id}`);
                click('#reset-buttons');
                assert([...doc.querySelectorAll('.node-light')].every(button => !button.classList.contains('is-on') && !button.classList.contains('is-intervention')), 'Reset incomplet.');
                click('#clear-edges');
                // Wait out the suppression of the synthetic post-drag click.
                await new Promise(resolve => win.setTimeout(resolve, 410));
                exercise.nodes.forEach(to => exercise.parents[to].forEach(from => draw(from, to)));
                click('#check-edges');
                assert(doc.querySelector('#feedback').classList.contains('is-correct'), `Correction incorrecte : ${exercise.id}`);
                assert(Boolean(doc.querySelector('#next-level')) === (exercise.id !== 'daily'), 'Navigation incorrecte après réussite.');
                assert(doc.querySelector('#feedback').textContent.includes('Êtes-vous sûr d’avoir tout testé ou avez-vous eu de la chance ?'), 'Invitation à vérifier le raisonnement absente.');
                click('#close-result');
            }
        });
        await test('Interface : aucun débordement ni bouton masqué à 360 px', async () => {
            frame.style.width = '360px';
            await settleLayout();
            assert(doc.documentElement.scrollWidth <= 360, `Débordement : ${doc.documentElement.scrollWidth}px`);
            const board = doc.querySelector('#board').getBoundingClientRect();
            const lights = [...doc.querySelectorAll('.node-light')].map(button => button.getBoundingClientRect());
            for (const rect of lights) assert(rect.left >= board.left && rect.right <= board.right && rect.top >= board.top && rect.bottom <= board.bottom, 'Lumière hors de la tablette.');
            for (let i = 0; i < lights.length; i++) for (let j = i + 1; j < lights.length; j++) {
                const a = lights[i], b = lights[j];
                assert(a.right <= b.left || b.right <= a.left || a.bottom <= b.top || b.bottom <= a.top, 'Lumières superposées.');
            }
        });
        await test('Téléphone : niveaux jouables de 320 à 390 px et en paysage', async () => {
            for (const [width, height] of [[320, 667], [360, 740], [390, 844], [844, 390]]) {
                frame.style.width = `${width}px`;
                frame.style.height = `${height}px`;
                for (const exercise of model.exercises) {
                    click(`#tab-${exercise.id}`);
                    await settleLayout();
                    assert(doc.documentElement.scrollWidth <= width, `Débordement à ${width}px, ${exercise.id}.`);
                    const board = doc.querySelector('#board').getBoundingClientRect();
                    assert(board.width >= width - 16 && board.height >= height, 'Plateau trop petit.');
                    const hud = doc.querySelector('#game-hud').getBoundingClientRect();
                    const actions = doc.querySelector('.tablet-actions').getBoundingClientRect();
                    const controls = [...doc.querySelectorAll('.node-light')].map(button => button.getBoundingClientRect());
                    const area = doc.querySelector('#nodes').getBoundingClientRect();
                    const centreX = controls.reduce((sum, rect) => sum + rect.left + rect.width / 2, 0) / controls.length;
                    const centreY = controls.reduce((sum, rect) => sum + rect.top + rect.height / 2, 0) / controls.length;
                    assert(Math.abs(centreX - area.left - area.width / 2) < 1 && Math.abs(centreY - area.top - area.height / 2) < 1,
                        `Voyants mal centrés à ${width}px : ${exercise.id}.`);
                    for (const rect of controls) {
                        assert(rect.width >= 44 && rect.height >= 44, 'Commande tactile trop petite.');
                        assert(rect.left >= board.left && rect.right <= board.right && rect.top >= board.top && rect.bottom <= board.bottom, 'Commande hors du plateau.');
                        assert(rect.top >= hud.bottom && rect.bottom <= actions.top, `Commande masquée à ${width}×${height}, ${exercise.id} : bouton ${rect.top}–${rect.bottom}, zone ${hud.bottom}–${actions.top}.`);
                    }
                    for (let i = 0; i < controls.length; i++) for (let j = i + 1; j < controls.length; j++) {
                        const a = controls[i], b = controls[j];
                        assert(a.right <= b.left || b.right <= a.left || a.bottom <= b.top || b.bottom <= a.top, `Commandes superposées à ${width}×${height}, ${exercise.id}, ${i}/${j}: ${JSON.stringify(a)} / ${JSON.stringify(b)}.`);
                    }
                    click('#clear-edges');
                    doc.querySelector('#board').scrollIntoView({ block: 'center' });
                    draw(exercise.nodes[0], exercise.nodes[1]);
                    assert(doc.querySelectorAll('.edge').length === 1, 'Tracé impossible sur téléphone.');
                }
            }
        });
        await test('Aide : panneau refermable sans perdre les essais', () => {
            const before = doc.querySelectorAll('.edge').length;
            click('#open-help');
            assert(!doc.querySelector('#help-panel').hidden, 'Aide inaccessible.');
            assert(doc.querySelector('#help-panel').scrollHeight >= doc.querySelector('#help-panel').clientHeight, 'Aide non défilable.');
            click('#close-help');
            assert(doc.querySelector('#help-panel').hidden && doc.querySelectorAll('.edge').length === before, 'Fermer l’aide perd les essais.');
        });
        await test('Réseau : flèches courbes sans traverser les lumières ou leurs commandes', async () => {
            const pairs = [[14, 13], [0, 5], [6, 12], [0, 12], [6, 5], [4, 0], [4, 12], [14, 5], [13, 6],
                [13, 14], [5, 0], [12, 6], [12, 0], [5, 6]];
            for (const [width, height] of [[320, 667], [390, 844], [1100, 800]]) {
                frame.style.width = `${width}px`;
                frame.style.height = `${height}px`;
                click('#tab-reseau');
                click('#clear-edges');
                await settleLayout();
                const paths = new Map();
                const edgePath = (from, to) => doc.querySelector(`.edge[aria-label="Supprimer la flèche ${from} vers ${to}"] .edge-line`);
                const assertStablePaths = (except = '') => {
                    for (const [key, path] of paths) {
                        if (key === except) continue;

        };
        const markers = {
            fr: /[àâçèéêëîïôùûüœ«»]|\b(le|la|les|des|du|une|et|ou|sur|pour|dans|avec|est|sont|vos|votre|vous|au|aux|ce|cette|ces|tous|toutes|aucun|bouton|boutons|flèche|flèches|appui|appuyez|allumer|éteindre|tracer|glisser|vérifier|aide|défi|exercice|naturel|allumé|éteint|chrono|réussi|effacer|réinitialiser|retour)\b/i,
            en: /\b(the|and|button|buttons|arrow|arrows|tap|drag|help|timer|challenge|done|yet|back|check|clear|reset|natural)\b/i
        };
        // Fragments of the other language's sentences (12 characters or more, between {…} marks)
        // that do not also occur in this language: none of them may appear on the page.
        const foreignFragments = (all, language) => {
            const other = language === 'fr' ? 'en' : 'fr';
            const plain = text => text.replace(/<[^>]+>/g, '');
            return Object.values(all[other]).flatMap(value => plain(value).split(/\{\w+\}/).map(part => part.trim()))
                .filter(part => part.length >= 12 && !Object.values(all[language]).some(own => plain(own).includes(part)));
        };
        // Texts on the page that belong to the other language (word list, or a fragment of its dictionary).
        const leftovers = page => {
            const language = page.documentElement.lang;
            const other = language === 'fr' ? 'en' : 'fr';
            const fragments = foreignFragments(dictionary(), language);
            return readableTexts(page).filter(text => markers[other].test(text) || fragments.some(fragment => text.includes(fragment)));
        };
        // A translation key shown as is (mistyped or missing key), e.g. "edge-label": a lowercase
        // hyphenated token that occurs in no text of the dictionary (unlike "avez-vous").
        const keyLike = /(?<![\p{L}\d-])[a-z][a-z0-9]*(?:-[a-z0-9]+)+(?![\p{L}\d-])/gu;
        const rawKeys = page => {
            const all = dictionary();
            const allowed = new Set([...Object.values(all.fr), ...Object.values(all.en)].flatMap(value => value.replace(/<[^>]+>/g, ' ').match(keyLike) || []));
            return readableTexts(page).filter(text => (text.match(keyLike) || []).some(token => !allowed.has(token)));
        };
        // Game gestures on the page currently in the frame.
        const game = () => {
            const page = frame.contentDocument;
            const view = frame.contentWindow;
            const light = id => page.querySelector(`.node-light[data-node="${id}"]`);
            const pointer = (type, element) => {
                const rect = element.getBoundingClientRect();
                return new view.PointerEvent(type, { clientX: rect.left + rect.width / 2, clientY: rect.top + rect.height / 2, bubbles: true, pointerId: 1, button: 0, isPrimary: true });
            };
            const drag = (from, toElement, at = null) => {
                light(from).dispatchEvent(pointer('pointerdown', light(from)));
                page.dispatchEvent(at ? new view.PointerEvent('pointermove', at) : pointer('pointermove', toElement));
                page.dispatchEvent(at ? new view.PointerEvent('pointerup', at) : pointer('pointerup', toElement));
            };
            const solution = index => {
                const exercise = view.CausalTablet.exercises[index];
                return exercise.nodes.flatMap(to => exercise.parents[to].map(from => ({ from, to })));
            };
            return {
                page, view, light, drag, solution,
                tap: id => light(id).dispatchEvent(new view.MouseEvent('click', { detail: 1, bubbles: true })),
                announcement: () => page.querySelector('#announcement').textContent
            };
        };
        const expectedDate = (view, language) => {
            const seed = String(view.CausalTablet.daySeed());
            const [year, month, day] = [seed.slice(0, 4), seed.slice(4, 6), seed.slice(6, 8)];
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            return language === 'fr' ? `Défi du ${day}/${month}/${year}` : `Challenge of ${Number(day)} ${months[Number(month) - 1]} ${year}`;
        };

        await test('Traductions : mêmes clés et repères, toutes les clés utilisées existent, aucun français dans les textes anglais', async () => {
            const page = await openTablet('?lang=fr', 'fr');
            const all = dictionary();
            const onlyOne = Object.keys(all.fr).filter(key => !(key in all.en)).concat(Object.keys(all.en).filter(key => !(key in all.fr)));
            assert(!onlyOne.length, `Clés présentes dans une seule langue : ${onlyOne.join(', ')}`);
            const marks = text => (text.match(/\{\w+\}/g) || []).sort().join(',');
            const differ = Object.keys(all.fr).filter(key => marks(all.fr[key]) !== marks(all.en[key]));
            assert(!differ.length, `Repères {…} différents : ${differ.join(', ')}`);
            // Every English value, even those no scenario displays: no French word, and different from French
            // except for words that are the same in both languages.
            const sameInBoth = ['exercise-trio-1-label', 'exercise-trio-2-label', 'mode-intervention'];
            const plain = text => text.replace(/<[^>]+>/g, ' ').replace(/\{\w+\}/g, ' ').replace(/Clément/g, '');
            const french = Object.keys(all.en).filter(key => markers.fr.test(plain(all.en[key])) || (all.en[key] === all.fr[key] && !sameInBoth.includes(key)));
            assert(!french.length, `Valeurs anglaises encore en français : ${french.join(', ')}`);
            // Keys used by tablette.html and tablette.js.
            const used = [...page.querySelectorAll('[data-i18n]')].map(element => element.dataset.i18n);
            for (const attribute of ['aria-label', 'title', 'content']) {
                page.querySelectorAll(`[data-i18n-${attribute}]`).forEach(element => used.push(element.getAttribute(`data-i18n-${attribute}`)));
            }
            used.push(...frame.contentWindow.CausalTablet.exercises.flatMap(exercise => ['label', 'title', 'description'].map(field => `exercise-${exercise.id}-${field}`)));
            const code = await fetch('../tablette.js').then(response => response.text());
            for (const match of code.matchAll(/\b(?:t|lookup)\(\s*(?:[^'\n]*?\?\s*)?'([a-z0-9-]+)'(?:\s*:\s*'([a-z0-9-]+)')?/g)) used.push(match[1], ...(match[2] ? [match[2]] : []));
            for (const match of code.matchAll(/\b(?:message|gestureNotice)\s*=\s*'([a-z0-9-]+)'/g)) used.push(match[1]);
            const expectedFromCode = ['announce-edge-added', 'timer-final', 'timer-running', 'guide-help', 'notice-natural', 'mode-intervention', 'result-incorrect'];
            assert(expectedFromCode.every(key => used.includes(key)), 'Extraction des clés de tablette.js incomplète : le test est à revoir.');
            const unknown = [...new Set(used)].filter(key => !(key in all.fr));
            assert(!unknown.length, `Clés utilisées mais absentes : ${unknown.join(', ')}`);
            assert(!readableTexts(page).some(text => /\{\w+\}/.test(text)), 'Repère {…} non remplacé dans la page.');
            assert(!rawKeys(page).length && !leftovers(page).length, `Page française incorrecte : ${[...rawKeys(page), ...leftovers(page)].slice(0, 3).join(' | ')}`);
        });

        await test('Anglais : page, aide, exercices, messages et annonces entièrement traduits', async () => {
            await openTablet('?lang=en', 'fr');
            const { page, view, light, drag, tap, solution, announcement } = game();
            assert(page.documentElement.lang === 'en' && page.title === 'The causal tablet · Clément Yvernes', `Titre : ${page.title}`);
            assert(!page.getElementById('anti-flash-style') && view.getComputedStyle(page.documentElement).opacity === '1', 'Page restée masquée.');
            assert(page.querySelector('#page-title').textContent === 'The causal tablet', 'Titre visible non traduit.');
            assert(page.querySelector('#back-link .back-text').textContent === 'Back' && page.querySelector('#back-link').getAttribute('aria-label') === 'Back to Clément Yvernes’s website', 'Lien de retour non traduit.');
            assert(page.querySelector('#back-link').getAttribute('href') === 'index.html?lang=en', 'Le retour ne garde pas la langue.');
            assert([...page.querySelectorAll('.tab-label')].map(label => label.textContent).join('|') === 'The duo|Trio I|Trio II|The network|Just for fun|Daily challenge', 'Onglets non traduits.');
            assert(page.querySelector('#tab-duo').getAttribute('aria-label') === 'Exercise 1, The duo, 2 buttons', 'Nom accessible de l’onglet non traduit.');
            assert(page.querySelector('#check-edges').textContent.includes('Check my arrows'), 'Bouton de vérification non traduit.');
            const toggle = page.querySelector('#language-toggle');
            assert(toggle.textContent === 'FR' && toggle.lang === 'fr' && toggle.getAttribute('aria-label') === 'Passer en français', 'Bouton de langue incorrect.');

            assert(light(7).getAttribute('aria-label').startsWith('Button 7, natural, off. Single tap:'), `Bouton : ${light(7).getAttribute('aria-label')}`);
            assert(light(7).title === dictionary().en['light-title'], `Infobulle : ${light(7).title}`);
            tap(7); tap(7);
            assert(announcement().startsWith('Button 7 under intervention.') && announcement().includes('7: off, under intervention'), `Annonce : ${announcement()}`);
            light(7).click();
            assert(announcement().startsWith('Button 7 value changed.') && announcement().includes('7: on, under intervention'), `Annonce : ${announcement()}`);
            assert(light(7).getAttribute('aria-label').startsWith('Button 7, intervention, on.'), 'État du bouton non traduit.');
            light(8).click();
            assert(announcement().startsWith('Button 8 is natural.'), `Annonce : ${announcement()}`);

            await wait(410);
            const [first] = solution(0);
            solution(0).forEach(({ from, to }) => {
                drag(from, light(to));
                assert(announcement() === `Arrow added: ${from} to ${to}.`, `Annonce : ${announcement()}`);
                assert(page.querySelector(`.edge[aria-label="Remove the arrow from ${from} to ${to}"]`), 'Flèche sans nom anglais.');
                assert(page.querySelector('.edge title').textContent === `Remove ${from} → ${to}`, 'Infobulle de flèche non traduite.');
            });
            // Every other arrow message: duplicate, same button, dropped outside, removal.
            drag(first.from, light(first.to));
            assert(announcement() === `The arrow from ${first.from} to ${first.to} already exists.`, `Annonce : ${announcement()}`);
            const self = light(first.from).getBoundingClientRect();
            drag(first.from, null, { clientX: self.left + self.width / 2 + 12, clientY: self.top + self.height / 2, bubbles: true, pointerId: 1, button: 0 });
            assert(announcement() === 'Choose two different buttons.', `Annonce : ${announcement()}`);
            const board = page.querySelector('#board').getBoundingClientRect();
            drag(first.from, null, { clientX: board.left + 6, clientY: board.top + board.height / 2, bubbles: true, pointerId: 1, button: 0 });
            assert(announcement() === 'Arrow cancelled. Drop it on the light of another button.', `Annonce : ${announcement()}`);
            page.querySelector(`.edge[aria-label="Remove the arrow from ${first.from} to ${first.to}"]`).dispatchEvent(new view.MouseEvent('click', { bubbles: true }));
            assert(announcement() === `Arrow removed: ${first.from} to ${first.to}.`, `Annonce : ${announcement()}`);
            page.querySelector('#check-edges').click();
            assert(page.querySelector('#feedback').textContent === 'Not yet…', `Résultat : ${page.querySelector('#feedback').textContent}`);
            page.querySelector('#close-result').click();
            await wait(410);
            drag(first.from, light(first.to));
            page.querySelector('#reset-buttons').click();
            assert(announcement() === 'All buttons are natural and off. Your arrows are kept.', `Annonce : ${announcement()}`);
            page.querySelector('#tab-trio-1').click();
            assert(announcement() === 'Exercise 2: Trio I. 3 buttons.', `Annonce : ${announcement()}`);
            const [trioEdge] = solution(1);
            drag(trioEdge.from, light(trioEdge.to));
            page.querySelector('#clear-edges').click();
            assert(announcement() === 'All the arrows of this exercise have been erased. The buttons keep their state.', `Annonce : ${announcement()}`);
            page.querySelector('#tab-duo').click();
            page.querySelector('#check-edges').click();
            const feedback = page.querySelector('#feedback').textContent;
            assert(feedback.includes('Well done!') && feedback.includes('Are you sure you tested everything, or were you lucky?'), `Résultat : ${feedback}`);
            assert(page.querySelector('#next-level').textContent === 'Next level →', 'Niveau suivant non traduit.');
            assert(page.querySelector('#tab-duo').getAttribute('aria-label').endsWith(', solved'), 'Réussite non annoncée en anglais.');

            page.querySelector('#open-help').click();
            assert(page.querySelector('#help-content h3').textContent === 'The goal', 'Aide non traduite.');
            page.querySelector('#close-help').click();
            page.querySelector('#tab-daily').click();
            assert(page.querySelector('#challenge-date').textContent === expectedDate(view, 'en'), `Date du défi : ${page.querySelector('#challenge-date').textContent}`);
            assert(page.querySelector('#exercise-timer').getAttribute('aria-label') === 'Playing time', 'Chrono non traduit.');
            page.querySelector('#tab-random').click();
            assert(page.querySelector('#exercise-description').textContent.startsWith('7 buttons and a randomly drawn graph.'), 'Description avec nombre non traduite.');
            const wrong = [...leftovers(page), ...rawKeys(page)];
            assert(!wrong.length, `Texte encore en français ou clé brute : ${wrong.slice(0, 3).join(' | ')}`);
        });

        await test('Bouton de langue : bascule en direct dans les deux sens, mémorisée, sans perdre la partie', async () => {
            // Show the first-steps banner (old visit) and play in English before switching.
            localStorage.setItem('tablette.lastVisit', String(Date.now() - 8 * 24 * 60 * 60 * 1000));
            await openTablet('?lang=en', 'en');
            const { page, view, light, drag, solution, announcement } = game();
            await wait(410);
            solution(0).forEach(({ from, to }) => drag(from, light(to)));
            page.querySelector('#check-edges').click();
            page.querySelector('#open-help').click(); // opening the help clears the gesture notice: open it first
            light(solution(0)[0].from).click(); // natural button: gesture notice in the banner
            const edges = page.querySelectorAll('.edge').length;
            assert(edges > 0 && !page.querySelector('#result-panel').hidden && !page.querySelector('#first-steps').hidden, 'État de départ incomplet.');
            assert(page.querySelector('#first-steps').textContent === dictionary().en['notice-natural'], `Bandeau : ${page.querySelector('#first-steps').textContent}`);

            const checkFrench = where => {
                assert(page.documentElement.lang === 'fr' && page.querySelector('#page-title').textContent === 'La tablette causale', `${where} : passage en français raté.`);
                const wrong = [...leftovers(page), ...rawKeys(page)];
                assert(!wrong.length, `${where} : texte resté en anglais ou clé brute : ${wrong.slice(0, 3).join(' | ')}`);
            };
            const checkEnglish = where => {
                assert(page.documentElement.lang === 'en' && page.querySelector('#page-title').textContent === 'The causal tablet', `${where} : passage en anglais raté.`);
                const wrong = [...leftovers(page), ...rawKeys(page)];
                assert(!wrong.length, `${where} : texte resté en français ou clé brute : ${wrong.slice(0, 3).join(' | ')}`);
            };

            page.querySelector('#language-toggle').click();
            checkFrench('Duo réussi');
            assert(page.querySelector('#tab-duo .tab-label').textContent === 'Le duo' && page.querySelector('#tab-duo').getAttribute('aria-label').endsWith(', réussi'), 'Onglets non retraduits.');
            assert(page.querySelectorAll('.edge').length === edges && page.querySelector('.edge').getAttribute('aria-label').startsWith('Supprimer la flèche'), 'Flèches perdues ou non retraduites.');
            assert(page.querySelector('.node-light').getAttribute('aria-label').startsWith('Bouton '), 'Boutons non retraduits.');
            assert(page.querySelector('#feedback').textContent.includes('Bien joué !') && !page.querySelector('#result-panel').hidden, 'Résultat perdu ou non retraduit.');
            assert(page.querySelector('#first-steps').textContent === dictionary().fr['notice-natural'], 'Bandeau non retraduit.');
            assert(page.querySelector('#help-content h3').textContent === 'L’objectif' && !page.querySelector('#help-panel').hidden, 'Aide fermée ou non retraduite.');
            assert(announcement() === 'Exercice 1 : Le duo. 2 boutons.', `Annonce restée dans l’ancienne langue : ${announcement()}`);
            assert(new URL(view.location.href).searchParams.get('lang') === 'fr' && localStorage.getItem('language') === 'fr', 'Choix non mémorisé ou absent de l’adresse.');
            assert(page.querySelector('#back-link').getAttribute('href') === 'index.html?lang=fr', 'Lien de retour non mis à jour.');
            const toggle = page.querySelector('#language-toggle');
            assert(toggle.textContent === 'EN' && toggle.lang === 'en' && toggle.getAttribute('aria-label') === 'Switch to English', 'Bouton de langue non mis à jour.');

            page.querySelector('#tab-daily').click();
            assert(page.querySelector('#challenge-date').textContent === expectedDate(view, 'fr'), `Date du défi : ${page.querySelector('#challenge-date').textContent}`);
            page.querySelector('#language-toggle').click();
            checkEnglish('Défi du jour');
            assert(page.querySelector('#challenge-date').textContent === expectedDate(view, 'en'), `Date du défi : ${page.querySelector('#challenge-date').textContent}`);
            assert(announcement() === 'Exercise 6: Daily challenge. 9 buttons.', `Annonce : ${announcement()}`);
            page.querySelector('#tab-duo').click();
            assert(page.querySelectorAll('.edge').length === edges, 'Partie perdue après deux bascules.');
            page.querySelector('#language-toggle').click();
            checkFrench('Retour au duo');
        });

        await test('Langue au chargement : adresse, puis choix mémorisé, puis langue du navigateur', async () => {
            let page = await openTablet('', 'en');
            assert(page.documentElement.lang === 'en' && new URL(frame.contentWindow.location.href).searchParams.get('lang') === 'en', 'Choix « en » du site ignoré.');
            page = await openTablet('', 'fr');
            assert(page.documentElement.lang === 'fr' && page.querySelector('#page-title').textContent === 'La tablette causale', 'Choix « fr » du site ignoré.');
            page = await openTablet('?lang=en', 'fr');
            assert(page.documentElement.lang === 'en', '?lang=en ne prime pas sur le choix mémorisé.');
            page = await openTablet('?lang=de', 'en');
            assert(page.documentElement.lang === 'en', 'Valeur ?lang inconnue : choix mémorisé « en » ignoré.');
            page = await openTablet('?lang=de', 'fr');
            assert(page.documentElement.lang === 'fr', 'Valeur ?lang inconnue : choix mémorisé « fr » ignoré.');
            page = await openTablet('', null);
            const expected = /^fr\b/i.test(frame.contentWindow.navigator.language || '') ? 'fr' : 'en';
            assert(page.documentElement.lang === expected, `Sans choix, la langue du navigateur (${frame.contentWindow.navigator.language}) n’est pas suivie.`);
        });

        await test('Anti-flash : page masquée en anglais jusqu’à sa traduction (800 ms au plus), jamais en français', async () => {
            // Copy without tablette.js: nothing translates the page, only the inline script runs.
            const withoutGame = source => source.replace('<script src="tablette.js" defer><\/script>', '');
            let page = await openTabletCopy(withoutGame, 'en');
            assert(page.getElementById('anti-flash-style') && frame.contentWindow.getComputedStyle(page.documentElement).opacity === '0', 'Page non masquée en anglais avant traduction.');
            await wait(900);
            assert(!page.getElementById('anti-flash-style') && frame.contentWindow.getComputedStyle(page.documentElement).opacity === '1', 'Page restée masquée au-delà de 800 ms.');
            page = await openTabletCopy(withoutGame, 'fr');
            assert(!page.getElementById('anti-flash-style') && frame.contentWindow.revealAfterTranslation === undefined, 'Page masquée en français.');
        });

        await test('Fichier de traductions illisible : la page garde son texte français, sans clé brute', async () => {
            // Simulates an error in tablette-translations.js (e.g. a straight apostrophe): the file is not loaded.
            const page = await openTabletCopy(source => source.replace('<script src="tablette-translations.js" defer><\/script>', ''), 'en');
            await wait(100);
            assert(frame.contentWindow.getComputedStyle(page.documentElement).opacity === '1', 'Page restée masquée.');
            assert(page.querySelector('#page-title').textContent === 'La tablette causale' && page.querySelector('#check-edges').textContent.includes('Vérifier mes flèches'), 'Textes de la page remplacés.');
            assert(page.querySelector('#help-content h3').textContent === 'L’objectif' && page.querySelector('#back-link').getAttribute('aria-label') === 'Retour au site de Clément Yvernes', 'Aide ou noms accessibles remplacés.');
            assert(page.querySelectorAll('.node-light').length === 2, 'Le jeu ne démarre plus.');
            frame.removeAttribute('srcdoc');
        });

        await test('Sans JavaScript : message bilingue avec lien de retour, commandes inutiles masquées', async () => {
            // A sandbox without allow-scripts runs the page exactly as a browser with JavaScript blocked.
            const blocked = document.createElement('iframe');
            blocked.setAttribute('sandbox', 'allow-same-origin');
            blocked.style.cssText = 'position:fixed;top:0;left:0;width:1100px;height:700px;border:0';
            const loaded = new Promise(resolve => blocked.addEventListener('load', resolve, { once: true }));
            blocked.src = '../tablette.html?lang=en';
            document.body.append(blocked);
            await loaded;
            try {
                const page = blocked.contentDocument;
                const style = element => blocked.contentWindow.getComputedStyle(element);
                const message = page.querySelector('.no-script');
                assert(message && style(message).display !== 'none' && message.getBoundingClientRect().height > 0, 'Message absent.');
                assert(message.textContent.includes('Activez JavaScript') && message.textContent.includes('Enable JavaScript'), 'Message non bilingue.');
                const links = [...message.querySelectorAll('a')].map(link => link.getAttribute('href'));
                assert(links.includes('index.html?lang=fr') && links.includes('index.html?lang=en'), `Liens de retour : ${links.join(', ')}`);
                assert(style(page.querySelector('.tablet-actions')).display === 'none' && style(page.querySelector('.game-hud')).display === 'none', 'Commandes inutiles encore affichées.');
                assert(!page.getElementById('anti-flash-style') && style(page.documentElement).opacity === '1', 'Page masquée sans JavaScript.');
            } finally {
                blocked.remove();
            }
        });

        await test('Barre du haut : retour, titre, langue et aide visibles sans chevauchement de 320 à 390 px', async () => {
            for (const language of ['fr', 'en']) {
                const page = await openTablet(`?lang=${language}`, language, 320, 700);
                for (const width of [320, 360, 390]) {
                    frame.style.width = `${width}px`;
                    await settleLayout();
                    assert(page.documentElement.scrollWidth <= width, `${language} ${width}px : débordement (${page.documentElement.scrollWidth}px).`);
                    const boxes = ['#back-link', '#page-title', '#language-toggle', '#open-help'].map(selector => page.querySelector(selector).getBoundingClientRect());
                    assert(boxes.every(box => box.width > 0 && box.left >= 0 && box.right <= width), `${language} ${width}px : élément de la barre hors écran.`);
                    assert(boxes.every((box, index) => index === 0 || boxes[index - 1].right <= box.left), `${language} ${width}px : éléments de la barre qui se chevauchent.`);
                    assert(boxes[2].width >= 44 && boxes[2].height >= 44, `${language} ${width}px : bouton de langue trop petit au toucher.`);
                }
            }
        });
        document.body.dataset.testStatus = failed ? 'failed' : 'passed';
        results.textContent = `${passed} passed, ${failed} failed\n${messages.join('\n')}`;
    })().catch(error => {
        document.body.dataset.testStatus = 'failed';
        document.getElementById('results').textContent += `\nFATAL ${error.stack}`;
    });
