  </defs>
  <circle cx="160" cy="160" r="160" fill="url(#bg)"/>
  <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle"
        font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="110" font-weight="600"
        fill="#ffffff">CY</text>
</svg>
